name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 22 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tron_energy_test
          MARIADB_USER: bot
          MARIADB_PASSWORD: bot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_INTEGRATION: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: tron_energy_test
      DB_USER: bot
      DB_PASSWORD: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name + ': ' + v.severity + ', direct=' + v.isDirect + ', fix=' + JSON.stringify(v.fixAvailable) + ', via=' + JSON.stringify(v.via.map(x => typeof x === 'string' ? x : { title:x.title, range:x.range, url:x.url })))"
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
